# Weekday-morning collector for bus 5250 + 1841 (TDX live stop events), plus the commute panel.
# GitHub starts scheduled runs late or not at all: it skipped 2026-10-20, started 2-3.7 h late on
# Oct 21-30, and moving the crons earlier did not help. So the crons fire just after midnight
# Taipei (00:37, 01:37, 02:37), and a run that starts before 03:45 waits until then, starts a
# fresh run of itself (workflow_dispatch, which starts at once) and exits; a run that starts after
# 03:45 waits until 07:15 and polls until 09:15. Each run thus stays inside GitHub's 6 h cap. The
# concurrency group lets only one run at a time (a newer queued run replaces an older queued one),
# and a run starting after 09:15 polls nothing.
name: collect
on:
  schedule:
    - cron: "37 16 * * 0-4"
    - cron: "37 17 * * 0-4"
    - cron: "37 18 * * 0-4"
  workflow_dispatch:
    inputs:
      test:
        description: "Single poll only (quick test)"
        type: boolean
        default: true
permissions:
  contents: write
  actions: write  # to start the fresh run
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # a 03:45 start runs ~335 min; GitHub's cap is 360
    env:
      TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
      TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Before 03:45? Wait, then hand off to a fresh run
        id: relay
        if: github.event_name == 'schedule' || inputs.test == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s); handoff=$(date -d 03:45 +%s)
          if [ "$now" -lt "$handoff" ]; then
            sleep $(( handoff - now ))
            for i in 1 2 3; do gh workflow run collect.yml --ref main -f test=false && break; sleep 30; done
            echo "handed_off=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.relay.outputs.handed_off != 'true'
      - name: Collect stop events (07:15-09:15)
        if: steps.relay.outputs.handed_off != 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test }}" = "true" ]; then
            python3 collect_5250.py --once
          else
            python3 collect_5250.py
          fi
      - name: Rebuild commute panel
        if: always() && steps.relay.outputs.handed_off != 'true'
        run: uv run python build_panel.py
      - name: Commit data
        if: always() && steps.relay.outputs.handed_off != 'true'
        run: |
          git config user.name "commute-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live data/panel
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "data: $(date +%F) morning"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1

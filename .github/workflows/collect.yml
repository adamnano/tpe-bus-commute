# Weekday-morning collector for bus 5250 + 1841 (TDX live stop events), plus the commute panel.
# GitHub starts scheduled runs late or not at all: on 2026-10-20 it skipped the run, and on Oct 21-23
# the 22:15-23:07 UTC crons started ~2h20m late (08:40 Taipei, after the 07:30 bus). So three crons
# fire well before dawn (20:10, 20:50, 21:30 UTC = 04:10, 04:50, 05:30 Taipei); the script waits
# until 07:15 and polls until 09:15. The concurrency group lets only one collect at a time, and a
# run starting after 09:15 polls nothing.
name: collect
on:
  schedule:
    - cron: "10 20 * * 0-4"
    - cron: "50 20 * * 0-4"
    - cron: "30 21 * * 0-4"
  workflow_dispatch:
    inputs:
      test:
        description: "Single poll only (quick test)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330  # an on-time 04:10 start runs ~305 min; GitHub's cap is 360
    env:
      TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
      TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v6
      - name: Collect stop events (07:15-09:15)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test }}" = "true" ]; then
            python3 collect_5250.py --once
          else
            python3 collect_5250.py
          fi
      - name: Rebuild commute panel
        if: always()
        run: uv run python build_panel.py
      - name: Commit data
        if: always()
        run: |
          git config user.name "commute-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live data/panel
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "data: $(date +%F) morning"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
